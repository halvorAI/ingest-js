name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # npm provenance and trusted publishing
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5+
      - run: npm ci
      - name: Check tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish --provenance --access public
        env:
          # First release only: set the NPM_TOKEN secret. After that, configure trusted publishing on
          # npmjs.com for this workflow and delete the secret; npm then authenticates with OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
