name: Publish to npm
on:
  release:
    types: [published]
  workflow_dispatch: # re-run a failed release without recreating it
permissions:
  contents: read
  id-token: write # npm provenance and trusted publishing
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5+
      - run: npm ci
      - run: npm run build # dist/ must exist before npm checks the bin entry
      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # prepublishOnly runs typecheck, tests and smoke. Trusted publishing (OIDC): no token.
      - run: npm publish --provenance --access public
